# Cilium is the CNI (and replaces kube-proxy); CoreDNS is deployed via Helm.
# Flannel is generated by default, so it has to be deleted explicitly.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
