---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}
spec:
  advanced:
    restoreToOriginalReplicaCount: true
  cooldownPeriod: 0
  minReplicaCount: 0
  maxReplicaCount: 1
  # Keep the app running if Mimir/mimir-proxy is unreachable; only a
  # successful query reporting the share down should scale to zero.
  fallback:
    failureThreshold: 3
    replicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${APP}
  triggers:
    - type: prometheus
      metadata:
        # Cloud Mimir's query API via the mimir-proxy sidecar (handles OAuth2).
        serverAddress: http://mimir-proxy.monitoring.svc.cluster.local:8080/prometheus
        # SMB share backing the smb-media PV (blackbox-exporter-lan lan-tcp probe).
        query: probe_success{cluster="kyak", instance="nas.286k.co:445"}
        threshold: "1"
        ignoreNullValues: "0"
