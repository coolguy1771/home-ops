---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}
spec:
  policyRef:
    name: ${APP}
  schedule:
    cron: "0 * * * *"
    # Native scheduling jitter replaces the old cluster-wide
    # MutatingAdmissionPolicy that jittered every VolSync mover Job's start.
    jitter: 5m
    runOnCreate: false
