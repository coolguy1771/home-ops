---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-r2-config
    template:
      engineVersion: v2
      data:
        # R2_ACCOUNT_ID never leaves this Secret: the ClusterRepository
        # substitutes R2_ENDPOINT/R2_BUCKET from here via Flux
        # postBuild.substituteFrom rather than a plaintext value in git.
        R2_ENDPOINT: "{{ .R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        R2_BUCKET: "{{ .R2_BUCKET }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  dataFrom:
    - extract:
        key: kopiur-r2-template
