---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur
  values:
    # cluster scope so the shared ClusterRepository (referenced by every
    # tenant namespace's SnapshotPolicy) is reconciled.
    installScope: cluster
    features:
      # Lets movers running in each app's namespace read the shared
      # ClusterRepository's credential Secret via SnapshotPolicy/Restore
      # credentialProjection, instead of duplicating it per namespace.
      credentialProjection:
        enabled: true
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
