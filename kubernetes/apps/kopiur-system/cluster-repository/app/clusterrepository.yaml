---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: r2
spec:
  allowedNamespaces:
    # Shared platform repository - opt every namespace in rather than
    # maintaining an explicit list as more apps adopt Kopiur backups.
    all: true
  backend:
    s3:
      bucket: ${R2_BUCKET}
      endpoint: ${R2_ENDPOINT}
      region: auto
      auth:
        secretRef:
          name: kopiur-r2-config
          namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopiur-r2-config
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  bootstrap:
    failurePolicy:
      # Default 120s bootstrap deadline isn't enough for this repository's
      # cold-cache connect time (30m+ with ~55k index blobs while maintenance
      # was failing); raise it so kopiur-controller's health-check job can
      # actually complete instead of dying to DeadlineExceeded on every attempt.
      activeDeadlineSeconds: 3600
  create:
    enabled: true
  credentialProjection:
    # Lets tenant-namespace SnapshotPolicy/Restore resources opt into copying
    # this Secret into their own namespace (movers load creds via a
    # namespace-local envFrom).
    allowed: true
  maintenance:
    enabled: true
    mover:
      cache:
        # Keep the kopia cache between maintenance runs so each run doesn't
        # re-download every index blob from R2 before it can start compacting.
        mode: Persistent
        capacity: 20Gi
        storageClassName: ceph-block
  parameters:
    epoch:
      # Let epochs advance (and index blobs compact) every 6h instead of
      # kopia's 24h default.
      minDuration: 6h
