---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app foundryvtt
spec:
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: kopiur-cluster-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/foundryvtt/foundryvtt/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: foundryvtt
  timeout: 5m
  wait: false
