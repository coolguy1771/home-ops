---
groups:
  - name: ersatztv
    rules:
      - alert: ErsatzTVDatabaseIsLocked
        expr: |-
          sum by (app) (count_over_time({app=~"ersatztv"} |~ "(?i)database is locked"[5m])) > 0
        for: 5m
        annotations:
          summary: >-
            {{ $labels.app }} is experiencing database issues
        labels:
          severity: critical

      - alert: ErsatzTVDatabaseIsMalformed
        expr: |-
          sum by (app) (count_over_time({app=~"ersatztv"} |~ "(?i)database disk image is malformed"[5m])) > 0
        for: 5m
        annotations:
          summary: >-
            {{ $labels.app }} is experiencing database issues
        labels:
          severity: critical
