---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ersatztv
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
    - ../../../../components/smb-scaler
  dependsOn:
    - name: kopiur-cluster-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/media/ersatztv/app
  # New PVC: VolSync is gone, so populate from the component's standby kopiur
  # Restore instead (onMissingSnapshot: Continue provisions an empty volume
  # on first deploy, restores the latest snapshot thereafter).
  patches:
    - patch: |-
        - op: replace
          path: /spec/dataSourceRef
          value:
            apiGroup: kopiur.home-operations.com
            kind: Restore
            name: ersatztv
      target:
        kind: PersistentVolumeClaim
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
