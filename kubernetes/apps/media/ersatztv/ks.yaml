---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ersatztv
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
    - ../../../../components/smb-scaler
  dependsOn:
    - name: kopiur-cluster-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/media/ersatztv/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
      # New PVC: populate from the kopiur Restore (onMissingSnapshot: Continue)
      # rather than the defunct VolSync ReplicationDestination.
      KOPIUR_DATASOURCE_APIGROUP: kopiur.home-operations.com
      KOPIUR_DATASOURCE_KIND: Restore
      KOPIUR_DATASOURCE_NAME: *app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
