---
groups:
  - name: jellyfin
    rules:
      - alert: JellyfinDatabaseIsLocked
        expr: |-
          sum by (app) (count_over_time({app=~"jellyfin"} |~ "(?i)database is locked"[5m])) > 0
        for: 5m
        annotations:
          summary: >-
            {{ $labels.app }} is experiencing database issues
        labels:
          severity: critical

      - alert: JellyfinDatabaseIsMalformed
        expr: |-
          sum by (app) (count_over_time({app=~"jellyfin"} |~ "(?i)database disk image is malformed"[5m])) > 0
        for: 5m
        annotations:
          summary: >-
            {{ $labels.app }} is experiencing database issues
        labels:
          severity: critical
