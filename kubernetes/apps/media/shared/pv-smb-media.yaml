---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: smb-media
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb-csi
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: nas.286k.co/media##
    volumeAttributes:
      source: //nas.286k.co/media
    nodeStageSecretRef:
      name: smb-credentials
      namespace: kube-system
  mountOptions:
    - dir_mode=0755
    - file_mode=0644
    - uid=1000
    - gid=1000
    - forceuid
    - forcegid
    - hard  # block and retry on NAS outages instead of returning EIO
    - actimeo=30  # cache attributes/dirents to speed up library scans
    - mfsymlinks
    - cache=strict
    - noserverino  # avoid inode collisions across ZFS datasets; breaks inode-based hardlink detection
    - noperm
