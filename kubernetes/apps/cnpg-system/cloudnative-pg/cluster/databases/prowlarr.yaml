---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr-postgres-role
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: prowlarr-postgres-role
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .PROWLARR_POSTGRES_USER }}"
        password: "{{ .PROWLARR_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: prowlarr
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: prowlarr-main
  annotations:
    # spec.cluster is immutable; let Flux recreate (reclaim policy is retain)
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  cluster:
    name: postgres18
  databaseReclaimPolicy: retain
  ensure: present
  name: prowlarr_main
  owner: prowlarr
