---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-postgres-role
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radarr-postgres-role
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .RADARR_POSTGRES_USER }}"
        password: "{{ .RADARR_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: radarr
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: radarr-main
  annotations:
    # spec.cluster is immutable; let Flux recreate (reclaim policy is retain).
    # Keep this annotation when pointing back at another cluster (incl. rollback).
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  cluster:
    name: postgres18
  databaseReclaimPolicy: retain
  ensure: present
  name: radarr_main
  owner: radarr
