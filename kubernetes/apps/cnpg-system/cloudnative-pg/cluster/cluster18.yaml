---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  primaryUpdateStrategy: unsupervised
  storage:
    size: 40Gi
    storageClass: ceph-block
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  managed:
    roles:
      - name: prowlarr
        ensure: present
        login: true
        passwordSecret:
          name: prowlarr-postgres-role
      - name: radarr
        ensure: present
        login: true
        passwordSecret:
          name: radarr-postgres-role
      - name: sonarr
        ensure: present
        login: true
        passwordSecret:
          name: sonarr-postgres-role
  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 512MB
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres18-v1
        serverName: postgres18-v1
  backup:
    target: prefer-standby
