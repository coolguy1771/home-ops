---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: CNPGClusterNotReady
          annotations:
            description: PostgreSQL container {{ $labels.pod }} has not been ready for 10 minutes.
            summary: CloudNativePG cluster {{ $labels.namespace }}/{{ $labels.pod }} is not ready.
          expr: |-
            kube_pod_container_status_ready{
              k8s_cluster_name="kyak",
              namespace="cnpg-system",
              container="postgres"
            } == 0
          for: 10m
          labels:
            severity: warning
        - alert: CNPGNoWritablePrimary
          annotations:
            description: No CloudNativePG instance reports itself as a writable primary.
            summary: CloudNativePG has no writable primary.
          expr: |-
            absent(
              cnpg_pg_replication_in_recovery{
                k8s_cluster_name="kyak",
                namespace="cnpg-system"
              } == 0
            )
          for: 5m
          labels:
            severity: critical
        - alert: CNPGInsufficientDiskSpace
          annotations:
            description: PostgreSQL volume {{ $labels.persistentvolumeclaim }} has less than 20 percent free space.
            summary: CloudNativePG storage is running low.
          expr: |-
            (
              kubelet_volume_stats_available_bytes{
                k8s_cluster_name="kyak",
                namespace="cnpg-system",
                persistentvolumeclaim=~"postgres16-.*"
              }
              /
              kubelet_volume_stats_capacity_bytes{
                k8s_cluster_name="kyak",
                namespace="cnpg-system",
                persistentvolumeclaim=~"postgres16-.*"
              }
            ) < 0.20
          for: 15m
          labels:
            severity: warning
        - alert: CNPGInsufficientDiskSpace
          annotations:
            description: PostgreSQL volume {{ $labels.persistentvolumeclaim }} has less than 10 percent free space.
            summary: CloudNativePG storage is critically low.
          expr: |-
            (
              kubelet_volume_stats_available_bytes{
                k8s_cluster_name="kyak",
                namespace="cnpg-system",
                persistentvolumeclaim=~"postgres16-.*"
              }
              /
              kubelet_volume_stats_capacity_bytes{
                k8s_cluster_name="kyak",
                namespace="cnpg-system",
                persistentvolumeclaim=~"postgres16-.*"
              }
            ) < 0.10
          for: 5m
          labels:
            severity: critical
        - alert: CNPGBackupStale
          annotations:
            description: CloudNativePG has no successful backup newer than 36 hours.
            summary: CloudNativePG backup is stale.
          expr: |-
            time() - max by (k8s_cluster_name, namespace, job) (
              cnpg_collector_last_available_backup_timestamp{
                k8s_cluster_name="kyak",
                namespace="cnpg-system"
              }
            ) > 129600
          for: 15m
          labels:
            severity: critical
        - alert: CNPGLastBackupFailed
          annotations:
            description: CloudNativePG's latest backup event is a failure.
            summary: The latest CloudNativePG backup failed.
          expr: |-
            max by (k8s_cluster_name, namespace, job) (
              cnpg_collector_last_failed_backup_timestamp{
                k8s_cluster_name="kyak",
                namespace="cnpg-system"
              }
            )
            >
            max by (k8s_cluster_name, namespace, job) (
              cnpg_collector_last_available_backup_timestamp{
                k8s_cluster_name="kyak",
                namespace="cnpg-system"
              }
            )
          for: 15m
          labels:
            severity: critical
