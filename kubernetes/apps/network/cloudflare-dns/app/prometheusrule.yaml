---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-dns-rules
spec:
  groups:
    - name: external-dns.rules
      rules:
        - alert: ExternalDNSStale
          expr: |-
            (
              time() - external_dns_controller_last_sync_timestamp_seconds > 300
            )
            and on (job)
            (
              up{job=~"cloudflare-dns|unifi-dns|external-dns"} == 1
            )
          for: 15m
          annotations:
            summary: >-
              ExternalDNS ({{ $labels.job }}) has not synced successfully in the last 15 minutes
          labels:
            severity: critical
