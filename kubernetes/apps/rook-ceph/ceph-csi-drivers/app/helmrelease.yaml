---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
  interval: 1h
  values:
    # Rook-compatible values, see
    # https://github.com/rook/rook/blob/v1.21.0/deploy/charts/ceph-csi-drivers/values.yaml
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        cephFsClientType: kernel
        clusterName: rook-ceph
        deployCsiAddons: false
        enableMetadata: false
        fsGroupPolicy: File
        generateOMapInfo: false
        snapshotPolicy: volumeSnapshot
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        controllerPlugin:
          deploymentStrategy:
            type: Recreate
          priorityClassName: system-cluster-critical
          replicas: 2
        nodePlugin:
          enableSeLinuxHostMount: false
          kubeletDirPath: /var/lib/kubelet
          priorityClassName: system-node-critical
    drivers:
      # Chart default for rbd is snapshotPolicy: none, which drops the
      # csi-snapshotter sidecar. Kopiur copyMethod: Snapshot needs this.
      # Per-driver chart defaults (controllerPlugin.replicas: 1) override
      # driverSpecDefaults, so replicas must be set here to take effect.
      # --http-endpoint enables the CSI sidecar metrics scraped by podmonitor.yaml.
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
          containerExtraArgs:
            csi-provisioner: ["--http-endpoint=:8080"]
            csi-attacher: ["--http-endpoint=:8081"]
            csi-resizer: ["--http-endpoint=:8082"]
            csi-snapshotter: ["--http-endpoint=:8083"]
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        # Was csi.cephFSKernelMountOptions on the rook-ceph chart, which
        # stopped applying when CSI moved to ceph-csi-operator.
        kernelMountOptions:
          ms_mode: secure
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
          containerExtraArgs:
            csi-provisioner: ["--http-endpoint=:8090"]
            csi-attacher: ["--http-endpoint=:8091"]
            csi-resizer: ["--http-endpoint=:8092"]
            csi-snapshotter: ["--http-endpoint=:8093"]
      nfs:
        enabled: false
      nvmeof:
        enabled: false
