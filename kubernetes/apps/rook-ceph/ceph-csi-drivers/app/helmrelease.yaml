---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.0.4
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
  interval: 1h
  values:
    # Rook-compatible values, see
    # https://github.com/rook/rook/blob/v1.20.6/deploy/charts/ceph-csi-drivers/values.yaml
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        cephFsClientType: kernel
        clusterName: rook-ceph
        deployCsiAddons: false
        enableMetadata: false
        fsGroupPolicy: File
        generateOMapInfo: false
        snapshotPolicy: volumeSnapshot
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        controllerPlugin:
          deploymentStrategy:
            type: Recreate
          priorityClassName: system-cluster-critical
          replicas: 2
        nodePlugin:
          enableSeLinuxHostMount: false
          kubeletDirPath: /var/lib/kubelet
          priorityClassName: system-node-critical
    drivers:
      # Chart default for rbd is snapshotPolicy: none, which drops the
      # csi-snapshotter sidecar. VolSync copyMethod: Snapshot needs this.
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        log:
          rotation:
            enabled: false
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        log:
          rotation:
            enabled: false
      nfs:
        enabled: false
      nvmeof:
        enabled: false
