---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-proxy
spec:
  # The rendered Envoy bootstrap embeds the OAuth2 client_id/client_secret, so it
  # is materialised as a Secret rather than a ConfigMap. Reuses the same 1Password
  # item ("observability-m2m") that k8s-monitoring / Alloy use for Mimir writes.
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mimir-proxy-secret
    template:
      engineVersion: v2
      data:
        bootstrap.yaml: |
          node:
            id: mimir-proxy
            cluster: mimir-proxy

          admin:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 9901

          static_resources:
            secrets:
              - name: mimir_client_secret
                generic_secret:
                  secret:
                    inline_string: "{{ trim .client_secret }}"

            listeners:
              - name: proxy
                address:
                  socket_address:
                    address: 0.0.0.0
                    port_value: 8080
                filter_chains:
                  - filters:
                      - name: envoy.filters.network.http_connection_manager
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          stat_prefix: mimir_proxy
                          http_filters:
                            - name: envoy.filters.http.credential_injector
                              typed_config:
                                "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                                overwrite: true
                                allow_request_without_credential: false
                                credential:
                                  name: envoy.http.injected_credentials.oauth2
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.oauth2.v3.OAuth2
                                    token_endpoint:
                                      cluster: authentik
                                      uri: https://auth.cloud.witl.xyz/application/o/token/
                                      timeout: 10s
                                    scopes:
                                      - "openid"
                                      - "tenant"
                                      - "mimir:read"
                                      - "mimir:write"
                                    client_credentials:
                                      client_id: "{{ trim .client_id }}"
                                      client_secret:
                                        name: mimir_client_secret
                            - name: envoy.filters.http.router
                              typed_config:
                                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          route_config:
                            name: mimir
                            virtual_hosts:
                              - name: mimir
                                domains: ["*"]
                                routes:
                                  - match:
                                      prefix: /
                                    route:
                                      cluster: mimir_cloud
                                      timeout: 45s
                                      host_rewrite_literal: mimir.cloud.witl.xyz
              - name: health
                address:
                  socket_address:
                    address: 0.0.0.0
                    port_value: 9902
                filter_chains:
                  - filters:
                      - name: envoy.filters.network.http_connection_manager
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          stat_prefix: health
                          http_filters:
                            - name: envoy.filters.http.router
                              typed_config:
                                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          route_config:
                            name: health
                            virtual_hosts:
                              - name: health
                                domains: ["*"]
                                routes:
                                  - match:
                                      path: /healthz
                                    direct_response:
                                      status: 200
                                      body:
                                        inline_string: OK

            clusters:
              - name: mimir_cloud
                type: LOGICAL_DNS
                connect_timeout: 10s
                dns_lookup_family: V4_PREFERRED
                load_assignment:
                  cluster_name: mimir_cloud
                  endpoints:
                    - lb_endpoints:
                        - endpoint:
                            address:
                              socket_address:
                                address: mimir.cloud.witl.xyz
                                port_value: 443
                transport_socket:
                  name: envoy.transport_sockets.tls
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
                    sni: mimir.cloud.witl.xyz
                    common_tls_context:
                      validation_context:
                        trusted_ca:
                          filename: /etc/ssl/certs/ca-certificates.crt
              - name: authentik
                type: LOGICAL_DNS
                connect_timeout: 10s
                dns_lookup_family: V4_PREFERRED
                load_assignment:
                  cluster_name: authentik
                  endpoints:
                    - lb_endpoints:
                        - endpoint:
                            address:
                              socket_address:
                                address: auth.cloud.witl.xyz
                                port_value: 443
                transport_socket:
                  name: envoy.transport_sockets.tls
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
                    sni: auth.cloud.witl.xyz
                    common_tls_context:
                      validation_context:
                        trusted_ca:
                          filename: /etc/ssl/certs/ca-certificates.crt
  dataFrom:
    - extract:
        key: observability-m2m
