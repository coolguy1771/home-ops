---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy:
      - alertname
      - cluster
      - namespace
    groupInterval: 10m
    groupWait: 5m
    receiver: pushover-warning
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      - receiver: pushover-critical
        groupWait: 30s
        matchers:
          - name: severity
            value: critical
            matchType: =
      - receiver: pushover-warning
        matchers:
          - name: severity
            value: warning
            matchType: =
  inhibitRules:
    - equal:
        - alertname
        - cluster
        - namespace
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: "null"
    # Pushover receivers are defined in global_config to avoid Alloy's nil
    # StoreBuilder when converting AlertmanagerConfig secret references.
