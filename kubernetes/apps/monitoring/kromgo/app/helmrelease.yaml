---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
spec:
  chartRef:
    kind: OCIRepository
    name: kromgo
  interval: 1h
  values:
    config:
      # Mimir's Prometheus-compatible query API, via the mimir-proxy sidecar
      # Deployment which injects the OAuth2 (client_credentials) bearer token for
      # mimir.cloud.witl.xyz. kromgo's Prometheus client cannot do OAuth2 itself.
      prometheus: http://mimir-proxy.monitoring.svc.cluster.local:8080/prometheus
      # Queries target the shared cloud Mimir (see mimir-proxy) which holds
      # multiple clusters, so every series selector is scoped to
      # cluster="kyak". Label schema is Grafana Alloy's, not kube-prometheus
      # stack's (no `service`/`pod` labels on node metrics; job names like
      # `integrations/kubernetes/kubelet`).
      badges:
        - title: Talos
          id: talos_version
          query: label_replace(max by (version_id) (node_os_info{cluster="kyak", name="Talos"}), "version_id", "$1", "version_id", "v(.+)")
          valueExpr: labels["version_id"]
          icon: si:talos

        - title: Kubernetes
          id: kubernetes_version
          query: label_replace(max by (git_version) (kubernetes_build_info{cluster="kyak", job=~".*kubelet.*"}), "git_version", "$1", "git_version", "v(.+)")
          valueExpr: labels["git_version"]
          icon: si:kubernetes

        - title: Flux
          id: flux_version
          query: label_replace(flux_instance_info{cluster="kyak"}, "revision", "$1", "revision", "v?([^@]+).*")
          valueExpr: labels["revision"]
          icon: si:flux

        - title: Nodes
          id: cluster_node_count
          query: count(count by (node) (kube_node_status_condition{cluster="kyak", condition="Ready"}))
          colorExpr: '"green"'

        - title: Pods
          id: cluster_pod_count
          query: sum(kube_pod_status_phase{cluster="kyak", phase="Running"})
          valueExpr: humanizeCommas(result)
          colorExpr: '"green"'

        - title: CPU
          id: cluster_cpu_usage
          query: round((1 - avg(rate(node_cpu_seconds_total{cluster="kyak", mode="idle"}[5m]))) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        - title: Memory
          id: cluster_memory_usage
          query: round(sum(node_memory_MemTotal_bytes{cluster="kyak"} - node_memory_MemAvailable_bytes{cluster="kyak"}) / sum(node_memory_MemTotal_bytes{cluster="kyak"}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        - title: Power
          id: cluster_power_usage
          query: sum(rate(kepler_node_platform_joules_total{cluster="kyak"}[5m]))
          valueExpr: humanizeCommas(math.round(result)) + "w"
          colorExpr: 'colorScale(result, [900.0, 1400.0], ["green", "orange", "red"])'

        - title: Age
          id: cluster_birth_age
          query: round(time() - min(kube_node_created{cluster="kyak"}))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'

        - title: Uptime
          id: cluster_uptime_age
          query: round(avg(time() - node_boot_time_seconds{cluster="kyak"}))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'

        - title: Alerts
          id: cluster_alert_count
          query: count(ALERTS{alertstate="firing", alertname!~"Watchdog|InfoInhibitor"}) or vector(0)
          colorExpr: 'colorScale(result, [1.0], ["green", "red"])'

    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.witl.xyz"
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
