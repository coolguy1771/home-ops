---
# Secret used as global_config for mimir.alerts.kubernetes. Pushover credentials
# live here so the AlertmanagerConfig CRD has no secret refs (avoids Alloy bug).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-global-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-global-config
    template:
      data:
        config: |
          global:
            resolve_timeout: 5m
          route:
            group_by:
              - alertname
              - cluster
              - namespace
            group_interval: 10m
            group_wait: 5m
            # Root default for mimir.alerts.kubernetes; Alloy nests AlertmanagerConfig
            # routes under this. Unrecognized severities fall through to pushover-warning
            # so malformed rules do not silently disappear.
            receiver: pushover-warning
            repeat_interval: 12h
            routes:
              - receiver: "null"
                matchers:
                  - alertname = "Watchdog"
              - receiver: pushover-critical
                group_wait: 30s
                matchers:
                  - severity = "critical"
              - receiver: pushover-warning
                matchers:
                  - severity = "warning"
          receivers:
          - name: "null"
          - name: pushover-critical
            pushover_configs:
            - token: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
              user_key: "{{ .PUSHOVER_USER_KEY }}"
              html: true
              send_resolved: true
              sound: gamelan
              ttl: 86400s
              url_title: View in Alertmanager
              priority: "1"
              title: '{{ "{{ .Status | toUpper }}" }} {{ "{{ .CommonLabels.alertname }}" }}'
              message: '{{ "{{ range .Alerts }}" }}{{ "{{ .Annotations.summary }}" }}{{ "{{ end }}" }}'
          - name: pushover-warning
            pushover_configs:
            - token: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
              user_key: "{{ .PUSHOVER_USER_KEY }}"
              html: true
              send_resolved: true
              sound: none
              ttl: 86400s
              url_title: View in Alertmanager
              priority: "-1"
              title: '{{ "{{ .Status | toUpper }}" }} {{ "{{ .CommonLabels.alertname }}" }}'
              message: '{{ "{{ range .Alerts }}" }}{{ "{{ .Annotations.summary }}" }}{{ "{{ end }}" }}'
  dataFrom:
    - extract:
        key: alertmanager
    - extract:
        key: pushover
