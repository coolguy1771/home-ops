---
# Secret used as global_config for mimir.alerts.kubernetes. This is the whole
# Alertmanager config: Alloy validates each AlertmanagerConfig CRD on its own, so
# a CRD cannot route to the pushover receivers defined here (and secret refs in
# CRDs hit an Alloy bug). Keep routing, inhibitions and receivers in this file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-global-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-global-config
    template:
      data:
        config: |
          global:
            resolve_timeout: 5m
          route:
            group_by:
              - alertname
              - cluster
              - namespace
            group_interval: 10m
            group_wait: 5m
            # Unrecognized severities fall through to pushover-warning so malformed
            # rules do not silently disappear.
            receiver: pushover-warning
            repeat_interval: 12h
            routes:
              - receiver: "null"
                matchers:
                  - alertname =~ "InfoInhibitor|Watchdog"
              - receiver: pushover-critical
                group_wait: 30s
                matchers:
                  - severity = "critical"
              - receiver: pushover-warning
                matchers:
                  - severity = "warning"
          inhibit_rules:
            - source_matchers:
                - severity = "critical"
              target_matchers:
                - severity = "warning"
              equal:
                - alertname
                - cluster
                - namespace
          receivers:
          - name: "null"
          - name: pushover-critical
            pushover_configs:
            - token: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
              user_key: "{{ .PUSHOVER_USER_KEY }}"
              html: true
              send_resolved: true
              sound: gamelan
              ttl: 86400s
              url_title: View in Alertmanager
              priority: "1"
              title: '{{ "{{ .Status | toUpper }}" }} {{ "{{ .CommonLabels.alertname }}" }}'
              message: '{{ "{{ range .Alerts }}" }}{{ "{{ .Annotations.summary }}" }}{{ "{{ end }}" }}'
          - name: pushover-warning
            pushover_configs:
            - token: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
              user_key: "{{ .PUSHOVER_USER_KEY }}"
              html: true
              send_resolved: true
              sound: none
              ttl: 86400s
              url_title: View in Alertmanager
              priority: "-1"
              title: '{{ "{{ .Status | toUpper }}" }} {{ "{{ .CommonLabels.alertname }}" }}'
              message: '{{ "{{ range .Alerts }}" }}{{ "{{ .Annotations.summary }}" }}{{ "{{ end }}" }}'
  dataFrom:
    - extract:
        key: alertmanager
    - extract:
        key: pushover
