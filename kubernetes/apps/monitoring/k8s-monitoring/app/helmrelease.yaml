---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-monitoring
  interval: 1h
  values:
    cluster:
      name: "kyak"
    destinations:
      loki:
        type: loki
        url: https://loki.cloud.witl.xyz/loki/api/v1/push
        auth:
          type: oauth2
          oauth2:
            tokenURL: https://auth.cloud.witl.xyz/application/o/token/
            clientIdKey: client_id
            clientSecretKey: client_secret
            scopes:
              - openid
              - tenant
              - loki:write
            endpointParams:
              grant_type: client_credentials
        secret:
          create: false
          name: observability-m2m
      mimir:
        type: prometheus
        url: https://mimir.cloud.witl.xyz/api/v1/push
        auth:
          type: oauth2
          oauth2:
            tokenURL: https://auth.cloud.witl.xyz/application/o/token/
            clientIdKey: client_id
            clientSecretKey: client_secret
            scopes:
              - openid
              - tenant
              - mimir:write
            endpointParams:
              grant_type: client_credentials
        secret:
          create: false
          name: observability-m2m
      tempo:
        type: otlp
        protocol: http
        url: https://tempo.cloud.witl.xyz/v1/traces
        auth:
          type: oauth2
          oauth2:
            tokenURL: https://auth.cloud.witl.xyz/application/o/token/
            clientIdKey: client_id
            clientSecretKey: client_secret
            scopes:
              - openid
              - tenant
              - tempo:write
            endpointParams:
              grant_type: client_credentials
        secret:
          create: false
          name: observability-m2m
        metrics: { enabled: false }
        logs: { enabled: false }
        traces: { enabled: true }
    #
    # Features
    #
    clusterMetrics:
      enabled: true
      collector: alloy-metrics
      kube-state-metrics:
        metricsTuning:
          includeMetrics:
            - kube_pod_container_status_ready
            - kube_pod_container_status_waiting_reason
            - kube_pod_status_ready
    hostMetrics:
      enabled: true
      collector: alloy-metrics
      nodeLabels:
        nodePool: true
        region: true
        availabilityZone: true
        nodeRole: true
        nodeOS: true
        nodeArchitecture: true
        instanceType: true
      linuxHosts:
        enabled: true
      energyMetrics:
        enabled: true
    clusterEvents:
      enabled: true
      collector: alloy-singleton
    nodeLogs:
      enabled: false
    podLogsViaKubernetesApi:
      enabled: true
      collector: alloy-logs
      nodeLabels:
        nodePool: true
        region: true
        availabilityZone: true
        nodeRole: true
        nodeOS: true
        nodeArchitecture: true
        instanceType: true
      structuredMetadata:
        node_pool: nodepool
        region: region
        availability_zone: availability_zone
        node_role: node_role
        node_os: os
        node_arch: architecture
        node_type: instance_type
    applicationObservability:
      enabled: false
      receivers:
        otlp:
          grpc:
            enabled: true
            port: 4317
          http:
            enabled: true
            port: 4318
        zipkin:
          enabled: true
          port: 9411
    autoInstrumentation:
      enabled: false
    annotationAutodiscovery:
      enabled: true
      collector: alloy-metrics
      nodeLabels:
        nodePool: true
        region: true
        availabilityZone: true
        nodeRole: true
        nodeOS: true
        nodeArchitecture: true
        instanceType: true
    prometheusOperatorObjects:
      enabled: true
      collector: alloy-metrics
    profiling:
      enabled: false
    integrations:
      collector: alloy-metrics
      cert-manager:
        instances:
          - name: cert-manager
            namespace: cert-manager
            labelSelectors:
              app.kubernetes.io/name: cert-manager
      alloy:
        instances:
          - name: alloy
            labelSelectors:
              app.kubernetes.io/name:
                - alloy-metrics
                - alloy-singleton
                - alloy-logs
                - alloy-receiver
                - alloy-profiles
    selfReporting:
      enabled: false
      destinations: []
      scrapeInterval: ""
    collectors:
      alloy-metrics:
        presets: [clustered, statefulset]
        alloy:
          storagePath: /var/lib/alloy
          mounts:
            extra:
              - name: alloy-wal
                mountPath: /var/lib/alloy
        controller:
          enableStatefulSetAutoDeletePVC: true
          volumeClaimTemplates:
            - metadata:
                name: alloy-wal
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: "ceph-block"
                resources:
                  requests:
                    storage: 5Gi
      alloy-singleton:
        presets: [singleton]
        extraConfig: |-
          local.file "observability_m2m_client_id" {
            filename = "/var/run/secrets/observability-m2m/client_id"
          }
          local.file "alertmanager_global" {
            filename = "/etc/alloy/alertmanager-global/config"
          }
          mimir.rules.kubernetes "mimir" {
            address       = "https://mimir.cloud.witl.xyz"
            sync_interval = "2m"
            oauth2 {
              token_url           = "https://auth.cloud.witl.xyz/application/o/token/"
              client_id           = string.trim_space(local.file.observability_m2m_client_id.content)
              client_secret_file  = "/var/run/secrets/observability-m2m/client_secret"
              scopes              = ["openid", "tenant", "mimir:write", "mimir:read"]
              endpoint_params     = { "grant_type" = "client_credentials" }
            }
          }
          mimir.alerts.kubernetes "mimir" {
            address       = "https://mimir.cloud.witl.xyz"
            global_config = local.file.alertmanager_global.content
            sync_interval = "2m"
            oauth2 {
              token_url           = "https://auth.cloud.witl.xyz/application/o/token/"
              client_id           = string.trim_space(local.file.observability_m2m_client_id.content)
              client_secret_file  = "/var/run/secrets/observability-m2m/client_secret"
              scopes              = ["openid", "tenant", "mimir:write", "mimir:read"]
              endpoint_params     = { "grant_type" = "client_credentials" }
            }
          }
        alloy:
          stabilityLevel: experimental
          mounts:
            extra:
              - name: observability-m2m
                mountPath: /var/run/secrets/observability-m2m
                readOnly: true
              - name: alertmanager-global
                mountPath: /etc/alloy/alertmanager-global
                readOnly: true
        controller:
          volumes:
            extra:
              - name: observability-m2m
                secret:
                  secretName: observability-m2m
              - name: alertmanager-global
                secret:
                  secretName: alertmanager-global-config
      alloy-logs:
        presets: [clustered, daemonset]
        alloy:
          storagePath: /var/lib/alloy
          mounts:
            extra:
              - name: alloy-log-positions
                mountPath: /var/lib/alloy
        controller:
          volumes:
            extra:
              - name: alloy-log-positions
                hostPath:
                  path: /var/alloy-log-storage
                  type: DirectoryOrCreate
    telemetryServices:
      kube-state-metrics:
        deploy: true
      node-exporter:
        deploy: true
      kepler:
        deploy: true
