---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deadvalues

on:
  pull_request:
    branches:
      - main
    paths:
      - .deadvalues.yaml
      - .github/workflows/deadvalues.yaml
      - kubernetes/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deadvalues:
    name: Deadvalues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history: the base commit must resolve locally for diff/scan --changed-since.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Diffs chart bumps (fails on BREAKING) and scans the apps the PR touches.
      - name: Run deadvalues
        uses: guarnz/deadvalues@6ed0a88f1513ea7c3c93b3bb9a4b4fc71b951b25 # v0.1.9
        with:
          path: kubernetes/apps
