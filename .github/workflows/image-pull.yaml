---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  extract:
    if: >-
      ${{
        needs.filter.outputs.changed-files != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: filter
    name: Image Pull - Extract Images
    runs-on: home-ops-runner
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Exports FLATE_BASE (the default branch), so only images new in this PR are listed.
      - name: Setup Flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5

      # flate exits non-zero when the base branch fails to render but still
      # prints the images it found; only a missing/invalid JSON list is fatal.
      - name: Extract Images
        id: extract
        run: |-
          flate diff images --path ./kubernetes/flux/cluster --output json > images.json || true
          jq --exit-status 'type == "array"' images.json > /dev/null

          echo "images=$(jq --compact-output '.' images.json)" >> $GITHUB_OUTPUT

          echo '## New images to Pull' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          jq '.' images.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  pull:
    if: ${{ needs.extract.outputs.images != '[]' }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: home-ops-runner
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    env:
      MATRIX_IMAGE: ${{ matrix.image }}
      TALOS_VERSION: v1.13.8
    steps:
      - name: Install talosctl
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          mkdir -p "${INSTALL_DIR}"
          case "$(uname -m)" in
            x86_64) asset=talosctl-linux-amd64 ;;
            aarch64) asset=talosctl-linux-arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          base="https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}"
          workdir=$(mktemp -d)
          trap 'rm -rf "${workdir}"' EXIT
          curl -fsSL "${base}/sha256sum.txt" -o "${workdir}/sha256sum.txt"
          curl -fsSL "${base}/${asset}" -o "${workdir}/${asset}"
          grep -F " ${asset}" "${workdir}/sha256sum.txt" | (
            cd "${workdir}" && sha256sum -c -
          )
          install -m 0755 "${workdir}/${asset}" "${INSTALL_DIR}/talosctl"
          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Pull Image
        run: talosctl --nodes $NODE image pull "${MATRIX_IMAGE}"

  success:
    if: ${{ !cancelled() }}
    needs: pull
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
